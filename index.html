<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaxen - Página em Construção</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,
                    #0f172a 0%,
                    #0f172a 60%,
                    #1e293b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 50px 40px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        .footer {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.1rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
    <!-- Umami Analytics 
    -->
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="e28a930e-2c0a-4665-b527-0bd660700381"></script>
</head>

<body>

    <div class="container">
        <h1>🚧 Página em Construção</h1>

        <p>
            Estamos trabalhando para entregar uma experiência alinhada
            aos nossos padrões de integridade e excelência.
        </p>

        <p>
            Em breve estaremos no ar.
        </p>

        <a href="/index_.html" class="button">
            Acessar Site Provisório
        </a>

        <div class="footer">
            &copy; 2026 Zaxen. Todos os direitos reservados.
        </div>
    </div>

</body>

</html>
